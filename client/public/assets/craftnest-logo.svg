<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <!-- Nest & Heart Artisan Emblem -->
  <g transform="translate(15, 10)">
    <!-- Soft Warm Glow circle -->
    <circle cx="35" cy="35" r="33" fill="#E8DDC6" fill-opacity="0.4" stroke="#354B36" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Woven Nest Base Twigs -->
    <path d="M12 40 C 18 58, 52 58, 58 40" stroke="#A96548" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M16 45 C 22 62, 48 62, 54 45" stroke="#354B36" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M22 51 C 28 62, 42 62, 48 51" stroke="#A96548" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Artisan Leaf Motif Left -->
    <path d="M18 36 C 14 26, 24 20, 27 28 C 24 32, 20 34, 18 36 Z" fill="#354B36"/>
    
    <!-- Artisan Leaf Motif Right -->
    <path d="M52 36 C 56 26, 46 20, 43 28 C 46 32, 50 34, 52 36 Z" fill="#354B36"/>

    <!-- Handmade with Heart Center Mark -->
    <path d="M35 37 C 35 37, 26 28, 26 22 C 26 17.5, 29.5 14, 34 14 C 36.5 14, 38.5 15.5, 39.5 17 C 40.5 15.5, 42.5 14, 45 14 C 49.5 14, 53 17.5, 53 22 C 53 28, 44 37, 44 37 L 39.5 42 L 35 37 Z" 
          fill="#A96548" 
          transform="scale(0.8) translate(7, 4)"/>
    <!-- Small spark/sparkle -->
    <circle cx="35" cy="12" r="2.5" fill="#A96548"/>
  </g>

  <!-- Brand Typography -->
  <text x="96" y="47" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" fill="#354B36" letter-spacing="0.5">
    Craft<tspan fill="#A96548">Nest</tspan>
  </text>
  
  <text x="98" y="67" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#A96548" letter-spacing="3.2">
    HANDMADE WITH HEART
  </text>

  <!-- Subtle artisan stitch line -->
  <line x1="98" y1="74" x2="270" y2="74" stroke="#E8DDC6" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
